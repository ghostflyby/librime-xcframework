name: build

on:
  workflow_dispatch:
    inputs:
      upstream_repo:
        description: Upstream librime repository.
        required: true
        default: rime/librime
      upstream_ref:
        description: Upstream ref to build.
        required: true
        default: master
      packaging_version:
        description: Release tag for this packaged artifact.
        required: false
        default: ""

permissions:
  contents: write
  actions: write

jobs:
  build-slice:
    name: build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: macos-14
            platform: macos-x86_64
          - arch: arm64
            runner: macos-14
            platform: macos-arm64
    steps:
      - name: Checkout packaging repository
        uses: actions/checkout@v6

      - name: Checkout upstream librime
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.upstream_repo }}
          ref: ${{ inputs.upstream_ref }}
          path: vendor/librime

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: ${{ github.workspace }}/vcpkg
          vcpkgJsonGlob: "vcpkg.json"

      - name: Setup CMake and Ninja
        uses: lukka/get-cmake@latest

      - name: Build slice
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
          UPSTREAM_SOURCE_DIR: ${{ github.workspace }}/vendor/librime
          UPSTREAM_REPO: ${{ inputs.upstream_repo }}
          UPSTREAM_REF: ${{ inputs.upstream_ref }}
          PACKAGING_VERSION: ${{ inputs.packaging_version }}
        run: scripts/build-one-arch.sh ${{ matrix.arch }}

      - name: Resolve source metadata
        run: |
          scripts/resolve-version.sh --env >> "${GITHUB_ENV}"
          scripts/resolve-version.sh --env > "out/${{ matrix.platform }}/source.env"
        env:
          UPSTREAM_SOURCE_DIR: ${{ github.workspace }}/vendor/librime
          UPSTREAM_REPO: ${{ inputs.upstream_repo }}
          UPSTREAM_REF: ${{ inputs.upstream_ref }}
          PACKAGING_VERSION: ${{ inputs.packaging_version }}

      - name: Upload slice
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: out/${{ matrix.platform }}

  package:
    name: package
    needs: build-slice
    runs-on: macos-14
    steps:
      - name: Checkout packaging repository
        uses: actions/checkout@v6

      - name: Download arm64 slice
        uses: actions/download-artifact@v8
        with:
          name: macos-arm64
          path: out/macos-arm64

      - name: Download x86_64 slice
        uses: actions/download-artifact@v8
        with:
          name: macos-x86_64
          path: out/macos-x86_64

      - name: Import source metadata
        run: grep -E '^(UPSTREAM_VERSION|UPSTREAM_COMMIT)=' out/macos-arm64/source.env >> "${GITHUB_ENV}"

      - name: Resolve packaging version
        run: |
          version="${PACKAGING_VERSION}"
          if [[ -z "${version}" ]]; then
            version="$(tr -d '[:space:]' < VERSION)"
          fi
          echo "PACKAGING_VERSION=${version}" >> "${GITHUB_ENV}"
        env:
          PACKAGING_VERSION: ${{ inputs.packaging_version }}

      - name: Package XCFramework
        env:
          UPSTREAM_REPO: ${{ inputs.upstream_repo }}
          UPSTREAM_REF: ${{ inputs.upstream_ref }}
        run: scripts/package-xcframework.sh

      - name: Upload distribution artifact
        uses: actions/upload-artifact@v4
        with:
          name: librime-xcframework
          path: |
            dist/librime.xcframework.zip
            dist/librime.xcframework.sha256
            dist/build-metadata.json

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_REPO: ${{ inputs.upstream_repo }}
          UPSTREAM_REF: ${{ inputs.upstream_ref }}
        run: |
          notes="Static macOS XCFramework for ${UPSTREAM_REPO}@${UPSTREAM_REF}."
          gh release view "${PACKAGING_VERSION}" >/dev/null 2>&1 && \
            gh release upload "${PACKAGING_VERSION}" dist/librime.xcframework.zip dist/librime.xcframework.sha256 dist/build-metadata.json --clobber || \
            gh release create "${PACKAGING_VERSION}" dist/librime.xcframework.zip dist/librime.xcframework.sha256 dist/build-metadata.json --title "${PACKAGING_VERSION}" --notes "${notes}"
