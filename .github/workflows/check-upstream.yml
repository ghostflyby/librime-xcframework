name: check-upstream

on:
  workflow_dispatch:
    inputs:
      upstream_repo:
        description: Upstream librime repository.
        required: true
        default: rime/librime
      force:
        description: Build and publish even if a pack release already exists for the latest upstream version.
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: write
  actions: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check latest upstream release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          UPSTREAM_REPO: ${{ inputs.upstream_repo || 'rime/librime' }}
          FORCE: ${{ inputs.force }}
        run: |
          set -o pipefail

          latest_tag="$(gh api "repos/${UPSTREAM_REPO}/releases/latest" --jq .tag_name)"
          upstream_version="${latest_tag#v}"

          if [[ "${FORCE}" != "true" ]]; then
            # Any pack release for this upstream version means the scheduled
            # check has nothing to do. Both suffix forms count: the old bare
            # counter and the epoch.minor.patch scheme that replaced it.
            existing_release="$(
              gh api --paginate "repos/${GH_REPO}/releases" --jq '.[].tag_name' |
                while read -r tag; do
                  suffix="${tag#"${upstream_version}-pack."}"
                  if [[ "${suffix}" != "${tag}" &&
                        "${suffix}" =~ ^[0-9]+([.][0-9]+)*$ ]]; then
                    printf '%s\n' "${tag}"
                  fi
                done |
                sort -V |
                tail -n 1
            )"
            if [[ -n "${existing_release}" ]]; then
              echo "already published for ${latest_tag}: ${existing_release}"
              exit 0
            fi
          fi

          gh workflow run build.yml \
            -f upstream_repo="${UPSTREAM_REPO}" \
            -f upstream_ref="${latest_tag}" \
            -f publish=true
